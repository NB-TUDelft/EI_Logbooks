# Publishes site/ to GitHub Pages on every push to main
# (repo settings: Pages source = GitHub Actions).
#
# The logbooks are written in the course book (NB-TUDelft/Electronic_Instrumentation,
# book/manuals/weekN/). Every run first copies them into templates/
# (tools/sync_templates.py). Runs come from pushes here, the nightly schedule,
# the Run workflow button, and the book itself: its workflow sends a
# "book-logbooks-changed" repository_dispatch when a logbook there changes.
# The PDFs are only rebuilt when something they depend on changed (the copied
# templates, the build tools, or this file), or when started by hand from the
# Actions tab. The build uses the newest sphinx-typst-render from its GitHub
# main branch and commits the templates, PDFs, index.json and README links back,
# so later site-only pushes publish them without rebuilding.
name: build and publish
on:
  push:
    branches: [main]
  workflow_dispatch:
  repository_dispatch:     # the course book says its logbooks changed (event type book-logbooks-changed)
    types: [book-logbooks-changed]
  schedule:
    - cron: '15 0 * * *'   # nightly: picks up changes in the course book, and switches the Highlight box on the dates in templates/highlight.txt
permissions:
  contents: write      # commit the copied templates, built PDFs and README links
  pages: write
  id-token: write
concurrency: { group: pages, cancel-in-progress: false }
jobs:
  publish:
    runs-on: ubuntu-latest
    environment: { name: github-pages, url: "${{ steps.deploy.outputs.page_url }}" }
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }

      - id: pages                 # gives the site's real address (base_url)
        uses: actions/configure-pages@v5

      - name: Copy the templates from the course book
        id: sync
        run: python3 tools/sync_templates.py

      - name: Did the templates change?
        id: changed
        run: |
          if [ -n "$(git status --porcelain templates)" ]; then echo "build=true" >> "$GITHUB_OUTPUT"; exit 0; fi
          before="${{ github.event.before }}"
          if [ "${{ github.event_name }}" = "schedule" ] || [ "${{ github.event_name }}" = "repository_dispatch" ]; then echo "build=false" >> "$GITHUB_OUTPUT"; exit 0; fi
          if [ "${{ github.event_name }}" != "push" ] || ! git cat-file -e "$before^{commit}" 2>/dev/null; then
            echo "build=true" >> "$GITHUB_OUTPUT"; exit 0
          fi
          if git diff --name-only "$before" HEAD | grep -qE '^(templates/.*.typ$|tools/(build_logbooks|outline_template)\.py|tools/requirements\.txt|\.github/workflows/pages\.yml)'; then
            echo "build=true" >> "$GITHUB_OUTPUT"
          else
            echo "build=false" >> "$GITHUB_OUTPUT"
          fi

      - if: steps.changed.outputs.build == 'true'
        uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - name: Build logbook PDFs (newest renderer)
        if: steps.changed.outputs.build == 'true'
        run: |
          pip install -r tools/requirements.txt
          pip show sphinx-typst-render | grep -E '^Version'
          python tools/build_logbooks.py
        env: { SITE_URL: "${{ steps.pages.outputs.base_url }}/" }
      - name: README links (site address and logbook list, every run)
        run: python3 tools/build_logbooks.py --links-only
        env: { SITE_URL: "${{ steps.pages.outputs.base_url }}/" }
      - name: Commit the templates, build and README
        run: |
          git add -A templates site/logbooks README.md
          if ! git diff --cached --quiet; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git commit -m "Build logbook PDFs / update README links" -m "Templates from the course book at ${{ steps.sync.outputs.commit }}."
            git push
          fi

      - name: Leave the folder README off the website
        run: rm -f site/README.md
      - uses: actions/upload-pages-artifact@v3
        with: { path: site }
      - id: deploy
        uses: actions/deploy-pages@v4
        continue-on-error: true   # GitHub sometimes cannot find the artifact yet
      - if: steps.deploy.outcome == 'failure'
        run: sleep 30
      - if: steps.deploy.outcome == 'failure'
        uses: actions/deploy-pages@v4
