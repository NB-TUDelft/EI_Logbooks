# Publishes site/ as-is: pdf.js viewer, logbook add-on and the built PDFs.
# The PDFs are built locally with build_logbooks.py and committed.
pages:
  stage: deploy
  image: alpine:3.20
  tags: [instance]   # TU Delft shared runner only runs jobs with this tag
  script:
    - echo "Publishing site/"
  pages:
    publish: site
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
