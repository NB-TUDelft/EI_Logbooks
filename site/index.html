<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>NB2420 Logbooks have moved</title>
<meta http-equiv="refresh" content="0; url=https://nb-tudelft.github.io/Electronic_Instrumentation/miscellaneous/logbooks.html">

<style>
:root { --navy: #0c2340; --cyan: #00a6d6; --bg: #eef1f5; --ink: #16181d; --muted: #5f6672; }
@media (prefers-color-scheme: dark) { :root { --bg: #12161d; --ink: #eef1f5; --muted: #a3acb9; } }
body { margin: 0; background: var(--bg); color: var(--ink); font: 15px/1.55 "Segoe UI", system-ui, sans-serif; }
header { background: var(--navy); color: #fff; }
.wrap { max-width: 760px; margin: 0 auto; padding: 0 16px; }
header .wrap { padding-top: 36px; padding-bottom: 32px; }
.badge { display: inline-block; font: 600 12px/1 inherit; letter-spacing: .06em; padding: 6px 9px; border-radius: 6px; background: var(--cyan); color: var(--navy); }
h1 { font-size: 26px; line-height: 1.2; margin: 14px 0 6px; font-weight: 650; }
main.wrap { padding-top: 30px; padding-bottom: 56px; }
a.go { display: inline-block; padding: 11px 16px; border-radius: 10px; background: var(--cyan); color: var(--navy); font-weight: 600; text-decoration: none; }
.note { font-size: 13px; color: var(--muted); }
</style>
</head>
<body>
<header>
  <div class="wrap">
    <span class="badge">NB2420</span>
    <h1>The logbooks have moved</h1>
  </div>
</header>
<main class="wrap">
  <p>The logbooks are now in the Electronic Instrumentation course book, next to the lab manuals.</p>
  <p><a class="go" href="https://nb-tudelft.github.io/Electronic_Instrumentation/miscellaneous/logbooks.html">Go to the logbooks</a></p>
