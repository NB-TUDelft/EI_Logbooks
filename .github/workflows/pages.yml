# Publishes site/ to GitHub Pages on every push to main
# (repo settings: Pages source = GitHub Actions).
#
# This repo is archived. The logbooks now live in the course book
# (NB-TUDelft/Electronic_Instrumentation), and site/ only sends visitors there.
# Nothing is copied from the book or rebuilt any more.
name: build and publish
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency: { group: pages, cancel-in-progress: false }
jobs:
  publish:
    runs-on: ubuntu-latest
    environment: { name: github-pages, url: "${{ steps.deploy.outputs.page_url }}" }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - name: Leave the folder README off the website
        run: rm -f site/README.md
      - uses: actions/upload-pages-artifact@v3
        with: { path: site }
      - id: deploy
        uses: actions/deploy-pages@v4
        continue-on-error: true   # GitHub sometimes cannot find the artifact yet
      - if: steps.deploy.outcome == 'failure'
        run: sleep 30
      - if: steps.deploy.outcome == 'failure'
        uses: actions/deploy-pages@v4
