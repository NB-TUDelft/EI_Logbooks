# Publishes site/ to GitHub Pages on every push to main
# (repo settings: Pages source = GitHub Actions).
#
# The logbook PDFs are only rebuilt when something they depend on changed
# (templates/, the build tools, or this file), or when started by hand from the
# Actions tab. The build uses the newest sphinx-typst-render from its GitHub
# main branch and commits the PDFs, index.json and README links back, so later
# site-only pushes publish them without rebuilding.
name: build and publish
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write      # commit the built PDFs and README links
  pages: write
  id-token: write
concurrency: { group: pages, cancel-in-progress: false }
jobs:
  publish:
    runs-on: ubuntu-latest
    environment: { name: github-pages, url: "${{ steps.deploy.outputs.page_url }}" }
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }

      - id: pages                 # gives the site's real address (base_url)
        uses: actions/configure-pages@v5

      - name: Did the templates change?
        id: changed
        run: |
          before="${{ github.event.before }}"
          if [ "${{ github.event_name }}" != "push" ] || ! git cat-file -e "$before^{commit}" 2>/dev/null; then
            echo "build=true" >> "$GITHUB_OUTPUT"; exit 0
          fi
          if git diff --name-only "$before" HEAD | grep -qE '^(templates/.*.typ$|tools/(build_logbooks|outline_template)\.py|tools/requirements\.txt|\.github/workflows/pages\.yml)'; then
            echo "build=true" >> "$GITHUB_OUTPUT"
          else
            echo "build=false" >> "$GITHUB_OUTPUT"
          fi

      - if: steps.changed.outputs.build == 'true'
        uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - name: Build logbook PDFs (newest renderer)
        if: steps.changed.outputs.build == 'true'
        run: |
          pip install -r tools/requirements.txt
          pip show sphinx-typst-render | grep -E '^Version'
          python tools/build_logbooks.py
        env: { SITE_URL: "${{ steps.pages.outputs.base_url }}/" }
      - name: README links (site address and logbook list, every run)
        run: python3 tools/build_logbooks.py --links-only
        env: { SITE_URL: "${{ steps.pages.outputs.base_url }}/" }
      - name: Commit the build and README
        run: |
          git add -A site/logbooks README.md
          if ! git diff --cached --quiet; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git commit -m "Build logbook PDFs / update README links"
            git push
          fi

      - uses: actions/upload-pages-artifact@v3
        with: { path: site }
      - id: deploy
        uses: actions/deploy-pages@v4
        continue-on-error: true   # GitHub sometimes cannot find the artifact yet
      - if: steps.deploy.outcome == 'failure'
        run: sleep 30
      - if: steps.deploy.outcome == 'failure'
        uses: actions/deploy-pages@v4
